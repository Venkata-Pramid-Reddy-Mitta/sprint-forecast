[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-forecast"
version = "0.3.0"
description = "Monte Carlo throughput forecasting that prices a committed delivery date as a probability, not a promise."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Venkata Pramid Reddy Mitta" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "cmarkgfm>=2024.1.14"]

[project.scripts]
sprint-forecast = "sprint_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["sprint_forecast"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
